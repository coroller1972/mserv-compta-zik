name: Build container image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/coroller1972/mserv-compta-zik

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Run tests
        run: ./gradlew --no-daemon test

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/main/docker/Dockerfile.jvm.staged
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      # Reference immuable a recopier dans le champ image: du Deployment (console OpenShift).
      - name: Publish image reference
        env:
          IMAGE: ghcr.io/coroller1972/mserv-compta-zik
          DIGEST: ${{ steps.build.outputs.digest }}
          COMMIT: ${{ github.sha }}
        run: |
          {
            echo "### Image publiée"
            echo
            echo "À coller dans le champ \`image:\` du Deployment :"
            echo
            echo '```'
            echo "${IMAGE}@${DIGEST}"
            echo '```'
            echo
            echo "Même image, par étiquette de commit : \`${IMAGE}:${COMMIT}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "::notice title=Image publiée::${IMAGE}@${DIGEST}"
