openapi: 3.0.3
info:
  title: Compta Zik API
  version: 1.0.0
  description: API de gestion comptable de l'activite musique.
servers:
  - url: /api
security:
  - bearerAuth: []
tags:
  - name: Accounting years
  - name: Attendance
  - name: Teachers
  - name: Musicians
  - name: Bands
  - name: Individual courses
  - name: Expenses
  - name: Documents
  - name: Data transfer
  - name: Backups
  - name: Audit
paths:
  /audit-events:
    get:
      tags: [Audit]
      operationId: listAuditEvents
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        '200':
          description: Événements d'audit les plus récents.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditEvent' }
  /data/backups:
    get:
      tags: [Backups]
      operationId: listBackups
      responses:
        '200':
          description: Archives ZIP complètes disponibles, les plus récentes en premier. Permission IMPORT_EXPORT.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BackupInfo' }
    post:
      tags: [Backups]
      operationId: createBackup
      responses:
        '201':
          description: Sauvegarde complète et cohérente créée (données, PDF et audit). Permission IMPORT_EXPORT.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupInfo' }
        '400':
          description: PDF référencé absent, chemin interdit ou limite de taille dépassée.
  /data/backups/{fileName}:
    get:
      tags: [Backups]
      operationId: downloadBackup
      parameters:
        - name: fileName
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Archive ZIP complète. Permission IMPORT_EXPORT.
          content:
            application/zip:
              schema: { type: string, format: binary }
        '404':
          description: Archive absente ou nom invalide.
  /data/restore/analyze:
    post:
      tags: [Backups]
      operationId: analyzeBackup
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Format, schéma, références et empreintes PDF vérifiés sans écriture. Permission IMPORT_EXPORT.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupAnalysis' }
        '400':
          description: Archive invalide ou incompatible.
        '413':
          description: Archive dépassant 64 Mio.
  /data/restore:
    post:
      tags: [Backups]
      operationId: restoreBackup
      parameters:
        - name: X-Restore-Confirmation
          in: header
          required: true
          schema: { type: string, enum: [RESTORE_ALL_DATA] }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Données remplacées atomiquement avec leurs identifiants et PDF originaux. Audit fusionné sans suppression. Sauvegarde préalable obligatoire. Permission IMPORT_EXPORT.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupRestoreResult' }
        '400':
          description: Confirmation absente, archive invalide, PDF actuel manquant ou contraintes non satisfaites. Aucun remplacement.
        '413':
          description: Archive dépassant 64 Mio.
  /data/export:
    get:
      tags: [Data transfer]
      operationId: exportData
      responses:
        '200':
          description: Export JSON des données de saisie, sans documents ni liens de facturation. Utiliser /data/backups pour une sauvegarde complète.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataTransfer'
  /data/import:
    post:
      tags: [Data transfer]
      operationId: importData
      parameters:
        - name: X-Import-Confirmation
          in: header
          required: true
          schema:
            type: string
            enum: [REPLACE_ALL_DATA]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataTransfer'
      responses:
        '200':
          description: Import termine.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataImportResult'
  /data/import/analyze:
    post:
      tags: [Data transfer]
      operationId: analyzeImport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataTransfer'
      responses:
        '200':
          description: Analyse sans modification de la base.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataImportAnalysis'
  /accounting-years/{year}/snapshot:
    get:
      tags: [Accounting years]
      operationId: getAccountingYearSnapshot
      parameters:
        - $ref: '#/components/parameters/Year'
      responses:
        '200':
          description: Snapshot annuel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountingYearSnapshot'
  /accounting-years/{year}/settings:
    put:
      tags: [Accounting years]
      operationId: updateSettings
      parameters:
        - $ref: '#/components/parameters/Year'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsUpdate'
      responses:
        '200':
          description: Configuration mise a jour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsView'
  /accounting-years/{year}/status:
    put:
      tags: [Accounting years]
      operationId: updateAccountingYearStatus
      description: Fait progresser ou rouvre le cycle de vie de l'annee comptable.
      parameters:
        - $ref: '#/components/parameters/Year'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountingYearStatusUpdate'
      responses:
        '200':
          description: Statut annuel mis a jour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
  /accounting-years/{year}/copy-configuration-from/{sourceYear}:
    post:
      tags: [Accounting years]
      operationId: copyAccountingYearConfiguration
      description: >-
        Copie vers une annee vide les tarifs, trimestres, groupes, adhesions et cours
        d'une annee source. Les personnes restent globales et aucune donnee source n'est modifiee.
      parameters:
        - $ref: '#/components/parameters/Year'
        - name: sourceYear
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '201':
          description: Configuration annuelle copiee.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountingYearSnapshot'
  /accounting-years/{year}/terms/{termId}/attendance:
    get:
      tags: [Accounting years]
      operationId: listTermAttendance
      parameters:
        - $ref: '#/components/parameters/Year'
        - $ref: '#/components/parameters/TermId'
      responses:
        '200':
          description: Presences du trimestre.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Attendance'
  /accounting-years/{year}/terms/{termId}/billing:
    get:
      tags: [Accounting years]
      operationId: getTermBilling
      description: >-
        Calcule les lignes et totaux financiers canoniques du trimestre.
        La subvention est egale au montant du aux professeurs, moins 50 % des cours
        individuels factures aux eleves, moins les cotisations groupes.
        Exemple : 1000 - (400 * 50 %) - 60 = 740 EUR.
      parameters:
        - $ref: '#/components/parameters/Year'
        - $ref: '#/components/parameters/TermId'
      responses:
        '200':
          description: Synthese de facturation du trimestre.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingSummary'
  /accounting-years/{year}/terms/{termId}/student-invoices:
    post:
      tags: [Accounting years]
      operationId: prepareStudentInvoices
      parameters:
        - $ref: '#/components/parameters/Year'
        - $ref: '#/components/parameters/TermId'
      responses:
        '202':
          description: Factures eleves preparees.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GeneratedDocument'
  /accounting-years/{year}/terms/{termId}/student-invoices/summary:
    post:
      tags: [Accounting years]
      operationId: prepareStudentInvoiceSummary
      parameters:
        - $ref: '#/components/parameters/Year'
        - $ref: '#/components/parameters/TermId'
      responses:
        '202':
          description: PDF de synthese des factures eleves prepare.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedDocument'
  /accounting-years/{year}/terms/{termId}/student-invoices/finalize:
    post:
      tags: [Accounting years]
      operationId: finalizeStudentInvoices
      parameters:
        - $ref: '#/components/parameters/Year'
        - $ref: '#/components/parameters/TermId'
      responses:
        '200':
          description: Factures élèves validées définitivement et rendues immuables.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GeneratedDocument'
  /accounting-years/{year}/terms/{termId}/teacher-invoice-requests:
    post:
      tags: [Accounting years]
      operationId: prepareTeacherInvoiceRequests
      parameters:
        - $ref: '#/components/parameters/Year'
        - $ref: '#/components/parameters/TermId'
      responses:
        '202':
          description: Demandes de facture professeurs preparees.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GeneratedDocument'
  /accounting-years/{year}/terms/{termId}/teacher-invoice-requests/finalize:
    post:
      tags: [Accounting years]
      operationId: finalizeTeacherInvoiceRequests
      parameters:
        - $ref: '#/components/parameters/Year'
        - $ref: '#/components/parameters/TermId'
      responses:
        '200':
          description: Demandes professeurs validées définitivement et rendues immuables.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GeneratedDocument'
  /accounting-years/{year}/terms/{termId}/teacher-invoice-requests/{teacherId}/prepare:
    post:
      tags: [Accounting years]
      operationId: prepareTeacherInvoiceRequest
      parameters:
        - $ref: '#/components/parameters/Year'
        - $ref: '#/components/parameters/TermId'
        - $ref: '#/components/parameters/TeacherId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeacherInvoicePrepareRequest' }
      responses:
        '202':
          description: Demande de facture du prestataire preparee independamment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedDocument'
  /accounting-years/{year}/terms/{termId}/teacher-invoice-requests/{teacherId}/finalize:
    post:
      tags: [Accounting years]
      operationId: finalizeTeacherInvoiceRequest
      parameters:
        - $ref: '#/components/parameters/Year'
        - $ref: '#/components/parameters/TermId'
        - $ref: '#/components/parameters/TeacherId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeacherInvoiceFinalizeRequest' }
      responses:
        '200':
          description: Demande du prestataire validee independamment et rendue immuable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedDocument'
  /accounting-years/{year}/terms/{termId}/documents:
    get:
      tags: [Accounting years]
      operationId: listTermDocuments
      parameters:
        - $ref: '#/components/parameters/Year'
        - $ref: '#/components/parameters/TermId'
      responses:
        '200':
          description: Documents actifs et historique du trimestre.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GeneratedDocument' }
  /accounting-years/{year}/expenses:
    get:
      tags: [Accounting years]
      operationId: listExpenses
      parameters:
        - $ref: '#/components/parameters/Year'
      responses:
        '200':
          description: Depenses de l'annee comptable.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Expense'
    post:
      tags: [Accounting years]
      operationId: createExpense
      parameters:
        - $ref: '#/components/parameters/Year'
      requestBody:
        $ref: '#/components/requestBodies/ExpenseBody'
      responses:
        '201':
          description: Depense creee.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
  /attendance:
    put:
      tags: [Attendance]
      operationId: upsertAttendance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Attendance'
      responses:
        '200':
          description: Presence mise a jour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attendance'
  /teachers:
    get:
      tags: [Teachers]
      operationId: listTeachers
      responses:
        '200':
          description: Professeurs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Teacher'
    post:
      tags: [Teachers]
      operationId: createTeacher
      requestBody:
        $ref: '#/components/requestBodies/TeacherBody'
      responses:
        '201':
          description: Professeur cree.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Teacher'
  /teachers/{id}:
    put:
      tags: [Teachers]
      operationId: updateTeacher
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        $ref: '#/components/requestBodies/TeacherBody'
      responses:
        '200':
          description: Professeur mis a jour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Teacher'
    delete:
      tags: [Teachers]
      operationId: deleteTeacher
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Professeur supprime ou desactive.
  /musicians:
    get:
      tags: [Musicians]
      operationId: listMusicians
      responses:
        '200':
          description: Musiciens.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Musician'
    post:
      tags: [Musicians]
      operationId: createMusician
      requestBody:
        $ref: '#/components/requestBodies/MusicianBody'
      responses:
        '201':
          description: Musicien cree.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Musician'
  /musicians/{id}:
    put:
      tags: [Musicians]
      operationId: updateMusician
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        $ref: '#/components/requestBodies/MusicianBody'
      responses:
        '200':
          description: Musicien mis a jour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Musician'
    delete:
      tags: [Musicians]
      operationId: deleteMusician
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Musicien supprime ou desactive.
  /musicians/{id}/restore:
    post:
      tags: [Musicians]
      operationId: restoreMusician
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Musicien désarchivé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Musician'
  /bands:
    get:
      tags: [Bands]
      operationId: listBands
      parameters:
        - $ref: '#/components/parameters/YearQuery'
      responses:
        '200':
          description: Groupes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Band'
    post:
      tags: [Bands]
      operationId: createBand
      requestBody:
        $ref: '#/components/requestBodies/BandBody'
      responses:
        '201':
          description: Groupe cree.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Band'
  /bands/{id}:
    put:
      tags: [Bands]
      operationId: updateBand
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        $ref: '#/components/requestBodies/BandBody'
      responses:
        '200':
          description: Groupe mis a jour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Band'
    delete:
      tags: [Bands]
      operationId: deleteBand
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Groupe supprime.
  /bands/{id}/members:
    put:
      tags: [Bands]
      operationId: replaceBandMembers
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BandMembers'
      responses:
        '200':
          description: Membres remplaces.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Band'
  /individual-courses:
    get:
      tags: [Individual courses]
      operationId: listIndividualCourses
      parameters:
        - $ref: '#/components/parameters/YearQuery'
      responses:
        '200':
          description: Cours individuels.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IndividualCourse'
    post:
      tags: [Individual courses]
      operationId: createIndividualCourse
      requestBody:
        $ref: '#/components/requestBodies/IndividualCourseBody'
      responses:
        '201':
          description: Cours individuel cree.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndividualCourse'
  /individual-courses/{id}:
    put:
      tags: [Individual courses]
      operationId: updateIndividualCourse
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        $ref: '#/components/requestBodies/IndividualCourseBody'
      responses:
        '200':
          description: Cours individuel mis a jour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndividualCourse'
    delete:
      tags: [Individual courses]
      operationId: deleteIndividualCourse
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Cours individuel supprime.
  /expenses/{id}:
    put:
      tags: [Expenses]
      operationId: updateExpense
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        $ref: '#/components/requestBodies/ExpenseBody'
      responses:
        '200':
          description: Depense mise a jour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
    delete:
      tags: [Expenses]
      operationId: deleteExpense
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Depense supprimee.
  /documents/{documentId}:
    get:
      tags: [Documents]
      operationId: downloadDocument
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Document genere.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  /documents/{documentId}/sent:
    post:
      tags: [Documents]
      operationId: markDocumentSent
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200': { description: Document marqué comme envoyé, content: { application/json: { schema: { $ref: '#/components/schemas/GeneratedDocument' } } } }
  /documents/{documentId}/cancel:
    post:
      tags: [Documents]
      operationId: cancelDocument
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DocumentCorrectionRequest' } } }
      responses:
        '200': { description: Document annulé, content: { application/json: { schema: { $ref: '#/components/schemas/GeneratedDocument' } } } }
  /documents/{documentId}/correct:
    post:
      tags: [Documents]
      operationId: correctDocument
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DocumentCorrectionRequest' } } }
      responses:
        '200': { description: Chaîne de correction créée, content: { application/json: { schema: { $ref: '#/components/schemas/DocumentCorrectionResult' } } } }
  /documents/{documentId}/teacher-adjustments:
    post:
      tags: [Documents]
      operationId: createTeacherBillingAdjustment
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TeacherBillingAdjustmentRequest' } } }
      responses:
        '201': { description: Régularisation en attente créée, content: { application/json: { schema: { $ref: '#/components/schemas/TeacherBillingAdjustment' } } } }
  /teacher-adjustments/{adjustmentId}:
    delete:
      tags: [Documents]
      operationId: deleteTeacherBillingAdjustment
      parameters:
        - name: adjustmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Régularisation en attente supprimée }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Year:
      name: year
      in: path
      required: true
      schema:
        type: integer
        format: int32
    YearQuery:
      name: year
      in: query
      required: true
      schema:
        type: integer
        format: int32
    TermId:
      name: termId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TeacherId:
      name: teacherId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBodies:
    TeacherBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Teacher'
    MusicianBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Musician'
    BandBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Band'
    IndividualCourseBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IndividualCourse'
    ExpenseBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Expense'
  schemas:
    AuditEvent:
      type: object
      required: [id, entityType, action, userId, details, createdAt]
      properties:
        id: { type: string, format: uuid }
        entityType: { type: string }
        entityId: { type: string, format: uuid }
        action: { type: string }
        userId: { type: string }
        details: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
    AccountingYearSnapshot:
      type: object
      required: [settings, teachers, musicians, bands, individualCourses, attendance, expenses]
      properties:
        settings:
          $ref: '#/components/schemas/SettingsView'
        teachers:
          type: array
          items:
            $ref: '#/components/schemas/Teacher'
        musicians:
          type: array
          items:
            $ref: '#/components/schemas/Musician'
        bands:
          type: array
          items:
            $ref: '#/components/schemas/Band'
        individualCourses:
          type: array
          items:
