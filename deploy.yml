kind: Deployment
apiVersion: apps/v1
metadata:
  name: mserv-compta-zik
  labels:
    app: compta-zik-app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: compta-zik-app
  template:
    metadata:
      labels:
        app: compta-zik-app
    spec:
      containers:
        - name: mserv-compta-zik
          image: ghcr.io/coroller1972/mserv-compta-zik:latest
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          env:
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              valueFrom:
                secretKeyRef:
                  name: mserv-compta-zik-db
                  key: reactive-url
            - name: QUARKUS_DATASOURCE_JDBC_URL
              valueFrom:
                secretKeyRef:
                  name: mserv-compta-zik-db
                  key: jdbc-url
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mserv-compta-zik-db
                  key: username
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mserv-compta-zik-db
                  key: password
            - name: QUARKUS_HTTP_CORS_ENABLED
              value: "true"
            - name: QUARKUS_HTTP_CORS_ORIGINS
              value: "https://compta-zik-frontend-ui-core.apps.dev-app-hub.0k6e.p1.openshiftapps.com"
            - name: QUARKUS_HTTP_CORS_METHODS
              value: "GET,POST,PUT,DELETE,OPTIONS"
            - name: QUARKUS_HTTP_CORS_HEADERS
              value: "Content-Type,Authorization"
            # ES256 : clés publiques via AUTH_IDENTITY_URL + /.well-known/jwks.json.
            # AUTH_JWT_SIGNING_* et le montage des clés restent dans Identity/deploy.yml.
            - name: AUTH_IDENTITY_URL
              value: "http://mserv-identity-svc:8083/api/auth"
            - name: AUTH_JWT_ISSUER
              valueFrom:
                secretKeyRef:
                  name: mserv-identity-jwt
                  key: issuer
            - name: AUTH_JWT_AUDIENCE
              # Must match AUTH_JWT_AUDIENCE in the Identity deployment.
              value: "identity-api"
          volumeMounts:
            - name: documents
              mountPath: /documents
          startupProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 18
          readinessProbe:
            tcpSocket:
              port: 8081
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              memory: "512Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      volumes:
        - name: documents
          persistentVolumeClaim:
            claimName: mserv-compta-zik-documents
---
kind: Service
apiVersion: v1
metadata:
  name: mserv-compta-zik-svc
  labels:
    app: compta-zik-app
spec:
  ports:
    - name: http-8081
      port: 8081
      protocol: TCP
      targetPort: 8081
  selector:
    app: compta-zik-app
---
kind: Route
apiVersion: route.openshift.io/v1
metadata:
  name: mserv-compta-zik-api
  labels:
    app: compta-zik-app
spec:
  host: compta-zik-frontend-ui-core.apps.dev-app-hub.0k6e.p1.openshiftapps.com
  path: /api
  to:
    kind: Service
    name: mserv-compta-zik-svc
  port:
    targetPort: http-8081
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: mserv-compta-zik-documents
  labels:
    app: compta-zik-app
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
